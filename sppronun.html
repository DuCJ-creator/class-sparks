    let active='all', sub='全部';
    const $=id=>document.getElementById(id);
    function renderNav(){ $('nav').innerHTML=Object.entries(db).map(([k,v])=>`<button class="nav-btn ${active===k?'active':''}" onclick="choose('${k}')"><span>${v.icon}</span>${v.label}<span class="count">${k==='all'?Object.keys(words).length:(v.subs?Object.values(v.subs).flat().length:0)}</span></button>`).join(''); }
    function choose(k){active=k;sub='全部';renderNav();renderTabs();renderWords();}
    function renderTabs(){const d=db[active];$('tabs').innerHTML=active==='all'?'':Object.keys(d.subs).map((x,i)=>`<button class="tab ${(!i&&sub==='全部')||sub===x?'active':''}" onclick="pickSub('${x.replaceAll("'","\\'")}')">${x}</button>`).join('');}
    function pickSub(x){sub=x;renderTabs();renderWords()}
    function currentWords(){let pool=active==='all'?Object.keys(words):(sub==='全部'?Object.values(db[active].subs).flat():db[active].subs[sub]);const q=$('search').value.trim().toLowerCase();return pool.filter(w=>!q||w.toLowerCase().includes(q)||words[w][1].includes(q));}
    function renderWords(){const d=db[active];$('title').textContent=d.label;$('subtitle').textContent=d.desc;const list=currentWords();$('wordCount').textContent=list.length;$('catCount').textContent=Object.keys(db).length-1;$('words').innerHTML=list.length?list.map(w=>{const x=words[w];return `<article class="word-card"><div class="word-top"><div><div class="word">${w}</div><div class="ipa">${x[0]}</div></div><button class="speak" onclick="speak('${w.replaceAll("'","\\'")}')" aria-label="播放 ${w} 的發音">🔊</button></div><div class="meaning">${x[1]}</div><div class="example"><button class="speak-line" onclick="speak('${x[2].replaceAll("'","\\'")}')">🔊</button><b>${x[2]}</b><span class="zh">${x[3]}</span></div></article>`}).join(''):`<div class="empty">找不到符合的單字，換個關鍵字試試看吧。</div>`;}
